  out_of_scope_signal: "out_of_scope_catalog"
  closing_signal: "closing"
  domain_signal: "domain"
  physical_client_topic: "physical_person_purchase"
  legal_flow_topic: "legal_entity_purchase_flow"
  payment_topic: "payment_without_details"
  purchase_topic: "purchase_ready"
  purchase_negative_signal: "purchase_negative"
  service_signals:
    - "company_services"
    - "parts_selection"
  service_topic: "company_services_info"
  requisites_signal: "requisites"

carryover_rules:
  - required_topics: ["purchase_ready"]
    required_signals: ["purchase_negative"]
    drop_topics: ["legal_entity_purchase_flow", "payment_without_details"]
  - add_topics: ["purchase_ready"]
    query_pattern: "\\b(api|демо|тис|tis)\\b"
    history_pattern: "(готов\\w* оплат|хочу купить|оформим|как купить|готов\\w* купить|готовы купить)"
  - required_topics: ["epc_tariffs"]
    query_pattern: "(подойдет.*как купить|подойд[её]т.*как купить|как купить|как оплатить|и как оплатить|оформ)"
    history_pattern: "(epc|тис|tis|тариф|цена|месяц|год)"
    add_topics: ["purchase_ready", "legal_entity_purchase_flow"]
  - required_topics: ["purchase_ready"]
    query_pattern: "(без api|api не нужен|без интеграц|просто доступ)"
    history_pattern: "(api|интеграц|1с)"
    add_topics: ["purchase_ready"]
  - required_topics: ["human_operator_request"]
    history_pattern: "(api|интеграц|1с)"
    add_topics: ["api_integration"]
  - required_topics: ["epc_tariffs"]
    history_pattern: "(\\btis\\b|\\bтис\\b)"
    add_topics: ["tis_tariffs"]
  - required_topics: ["tis_tariffs"]
    history_pattern: "(\\bepc\\b|\\bепс\\b|\\bепц\\b)"
    add_topics: ["epc_tariffs"]
  - required_topics: ["epc_tariffs"]
    query_pattern: "(как оплатить|и как оплатить|как оформить|какие данные|данные отправить)"
    history_pattern: "(tis|тис|итогов|итоговая сумма|добавьте)"
    drop_topics: ["epc_tariffs"]
    add_topics: ["legal_entity_purchase_flow", "purchase_ready"]
  - required_topics: ["nonsense_input"]
    query_pattern: "(как оплатить|и как оплатить|как оформить|какие данные|данные отправить)"
    history_pattern: "(инн|реквизит|сч[её]т|qr|оформ|купить|оплат)"
    add_topics: ["legal_entity_purchase_flow"]
  - required_topics: ["nonsense_input"]
    query_pattern: "(на компанию|мы юрлицо|мы ип|на ип|оформим на ип|оформим на компанию)"
    add_topics: ["legal_entity_purchase_flow"]
  - required_topics: ["epc_tariffs"]
    required_signals: ["requisites"]
    add_topics: ["legal_entity_purchase_flow"]
    drop_topics: ["epc_tariffs"]
  - required_topics: ["purchase_ready"]
    query_pattern: "(как купить|как оформить|оформим|оформля|как оплатить|какие данные|данные отправить)"
    history_pattern: "(epc|тис|tis|тариф|цена|месяц|год|доступ)"
    add_topics: ["legal_entity_purchase_flow"]
  - required_topics: ["macos_support"]
    history_pattern: "(хочу купить|купить доступ)"
    history_not_pattern: "(ип|юр|юрид|инн|счет|сч[её]т|qr)"
    add_topics: ["legal_status_unknown"]
  - required_topics: ["physical_person_purchase"]
    history_pattern: "(демо|demo|trial|демка)"
    add_topics: ["demo_access"]
  - required_topics: ["no_private_sales_reason"]
    history_pattern: "(демо|demo|trial|демка)"
    add_topics: ["demo_access"]
  - required_topics: ["no_private_sales_reason"]
    any_history_or_signal:
      history_pattern: "(физ\\w*|частн\\w*)"
      signal: "physical"
    add_topics: ["physical_person_purchase"]
  - required_topics: ["specific_brand_check"]
    query_pattern: "(конкретно)"
    history_pattern: "(какие бренды|список брендов|все бренды)"
    add_topics: ["brand_list_request"]
  - required_topics: ["data_accuracy_doubt"]
    history_pattern: "(бесплатн\\w*|поставщик\\w*|в интернете)"
    add_topics: ["free_catalog_comparison"]
  - required_topics: ["competitor_choice"]
    history_pattern: "(дорого|дешевле)"
    add_topics: ["price_objection"]
  - required_topics: ["epc_tariffs"]
    history_pattern: "(конкурент|уйду)"
    add_topics: ["competitor_choice"]
  - required_topics: ["human_operator_request"]
    history_pattern: "\\b(api|1с|интеграц|integration)\\b"
    add_topics: ["api_integration"]
  - required_topics: ["tis_tariffs"]
    history_pattern: "(только один бренд|отдельные каталоги|только .* каталог)"
    add_topics: ["partial_catalog_request"]
  - required_topics: ["tis_tariffs"]
    history_pattern: "(назовите бренды|бренды для расчета|бренды для расчёта)"
    query_pattern: "\\b(bmw|audi|mercedec|wolksvagen|тайота|лексус|лекссс|хундай|kiaa|porsch|renauldt|pegeot|ауди|мерседес|фольцваген|шкода|toyota|lexus|porsche|hyundai|kia|zeekr|zeeker|зикер|лада|ваз|ваза|автоваз|bobcat|бобкат|бобкэт)\\b"
    add_topics: ["specific_brand_check"]
  - required_topics: ["demo_access"]
    history_pattern: "\\b(tis|тис|tiss)\\b"
    add_topics: ["tis_tariffs"]
  - required_topics: ["physical_person_purchase"]
    history_pattern: "\\b(tis|тис|tiss)\\b"
    add_topics: ["tis_tariffs"]
  - required_topics: ["price_objection"]
    history_pattern: "(бесплатн\\w*|поставщик\\w*|в интернете)"
    add_topics: ["free_catalog_comparison"]
  - required_topics: ["company_services_info"]
    any_history_or_query:
      history_pattern: "(бесплатн\\w*|поставщик\\w*|в интернете)"
      query_pattern: "(бесплатн\\w*|поставщик\\w*)"
    add_topics: ["free_catalog_comparison"]
  - required_topics: ["legal_entity_purchase_flow"]
    history_pattern: "(физ\\w*|частн\\w*)"
    add_topics: ["physical_person_purchase"]
  - required_topics: ["specific_brand_check"]
    query_pattern: "(добавьте|посчита|общую сумму|итог)"
    history_pattern: "(tis|тис|tiss)"
    add_topics: ["tis_tariffs"]
  - required_topics: ["purchase_ready"]
    required_signals: ["parts_selection"]
    drop_topics: ["purchase_ready"]
    add_topics: ["company_services_info"]
  - required_topics: ["legal_entity_purchase_flow"]
    required_signals: ["company_services"]
    drop_topics: ["legal_entity_purchase_flow", "purchase_ready"]
    add_topics: ["company_services_info"]
  - required_topics: ["purchase_ready"]
    required_signals: ["company_services"]
    drop_topics: ["purchase_ready", "legal_entity_purchase_flow"]
    add_topics: ["company_services_info"]
  - required_topics: ["legal_entity_purchase_flow"]
    query_pattern: "(куда ты меня оформлять|горячку не пори|мы шь[её]м одежд|редких пород рыб)"
    drop_topics: ["legal_entity_purchase_flow", "purchase_ready"]
    add_topics: ["nonsense_input"]
  - required_topics: ["purchase_ready"]
    query_pattern: "(куда ты меня оформлять|горячку не пори|мы шь[её]м одежд|редких пород рыб)"
    drop_topics: ["purchase_ready", "legal_entity_purchase_flow"]
    add_topics: ["nonsense_input"]
  - required_topics: ["specific_brand_check"]
    required_signals: ["parts_selection"]
    drop_topics: ["specific_brand_check"]
    add_topics: ["company_services_info"]
  - required_topics: ["company_services_info"]
    required_signals: ["closing"]
    drop_topics: ["company_services_info"]
    add_topics: ["nonsense_input"]
  - required_topics: ["company_services_info"]
    query_pattern: "(спасибо|благодар|понял|понятно)"
    drop_topics: ["company_services_info"]
    add_topics: ["nonsense_input"]
  - required_topics: ["purchase_ready"]
    required_signals: ["out_of_scope_catalog"]
    drop_topics: ["purchase_ready"]
    add_topics: ["nonsense_input"]
  - required_topics: ["specific_brand_check"]
    required_signals: ["out_of_scope_catalog"]
    drop_topics: ["specific_brand_check"]
    add_topics: ["nonsense_input"]
  - required_topics: ["brand_list_request"]
    required_signals: ["out_of_scope_catalog"]
    drop_topics: ["brand_list_request"]
    add_topics: ["nonsense_input"]
  - required_topics: ["purchase_ready"]
    required_signals: ["phone_like"]
    history_pattern: "(менеджер|оператор|человек|соедини|переключи|номер телефона|укажите.*номер)"
    drop_topics: ["purchase_ready"]
    add_topics: ["human_operator_request"]
  - required_topics: ["legal_entity_purchase_flow"]
    required_signals: ["phone_like"]
    history_pattern: "(менеджер|оператор|человек|соедини|переключи|номер телефона|укажите.*номер)"
    drop_topics: ["legal_entity_purchase_flow", "purchase_ready"]
    add_topics: ["human_operator_request"]
  - required_topics: ["nonsense_input"]
    required_signals: ["phone_like"]
    history_pattern: "(менеджер|оператор|человек|соедини|переключи|номер телефона|укажите.*номер|корректн\\w*\\s+номер|11\\s*цифр)"
    drop_topics: ["nonsense_input"]
    add_topics: ["human_operator_request"]

conflict_rules:
  - required_topics: ["payment_without_details"]
    add_topics: ["legal_entity_purchase_flow"]
    drop_topics: ["purchase_ready"]
  - required_topics: ["api_integration", "purchase_ready"]
    query_pattern: "(купить|доступ|оплат|оформ)"
    drop_topics: ["purchase_ready"]
  - required_topics: ["no_private_sales_reason"]
    required_signals: ["physical"]
    add_topics: ["physical_person_purchase"]
  - required_topics: ["demo_access"]
    required_signals: ["no_private_reason"]
    add_topics: ["no_private_sales_reason"]
  - required_topics: ["competitor_choice", "price_objection"]
    query_pattern: "(уйду|выберу).*(дешевл|конкурент)"
    drop_topics: ["price_objection"]
  - required_topics: ["api_integration", "purchase_ready"]
    query_pattern: "(без api|api не нужен|без интеграц)"
    drop_topics: ["api_integration"]
  - required_topics: ["api_integration", "purchase_ready"]
    query_pattern: "(интеграц|api|1с)"
    history_pattern: "^(?!.*(готов\\w*|купить|оплат|оформ)).*$"
    drop_topics: ["purchase_ready"]
  - required_topics: ["no_private_sales_reason", "physical_person_purchase"]
    query_pattern: "^(?!.*(почему|причин|зачем)).*$"
    history_pattern: ".*(tis|тис|tiss).*"
    drop_topics: ["no_private_sales_reason"]
    add_topics: ["tis_tariffs"]
  - required_topics: ["no_private_sales_reason", "physical_person_purchase"]
    required_signals: ["no_private_reason"]
    drop_topics: ["physical_person_purchase"]
  - required_topics: ["payment_without_details", "legal_entity_purchase_flow"]
    query_pattern: "(город не скажу)"
    drop_topics: ["legal_entity_purchase_flow"]
  - required_topics: ["human_operator_request", "epc_tariffs"]
    drop_topics: ["epc_tariffs"]
  - required_topics: ["human_operator_request", "tis_tariffs"]
    drop_topics: ["tis_tariffs"]
  - required_topics: ["human_operator_request"]
    query_pattern: "(не подбираете напрямую|подбираете напрямую|подбор деталей)"
    history_pattern: "(подбор деталей выполняется|чат-бот не подбирает запчасти)"
    drop_topics: ["human_operator_request"]
    add_topics: ["company_services_info"]
  - required_topics: ["legal_entity_purchase_flow", "epc_tariffs"]
    required_signals: ["payment_method"]
    drop_topics: ["epc_tariffs"]
  - required_topics: ["legal_entity_purchase_flow"]
    history_pattern: "(договор|карточк|документ)"
    query_pattern: "(инн|телефон|контакт|\\+?\\d{5,}|[0-9]{5,})"
    drop_topics: ["legal_entity_purchase_flow", "purchase_ready"]
    add_topics: ["company_services_info"]
  - required_topics: ["nonsense_input"]
    history_pattern: "(договор|карточк|документ)"
    query_pattern: "(договор|карточк|документ|повтори|какие.*документ|инн|телефон|контакт|\\+?\\d{5,}|[0-9]{5,})"
    drop_topics: ["nonsense_input"]
    add_topics: ["company_services_info"]
  - required_topics: ["company_services_info", "epc_tariffs"]
    drop_topics: ["epc_tariffs"]
  - required_topics: ["company_services_info", "price_objection"]
    required_signals: ["company_services"]
    drop_topics: ["price_objection"]
  - required_topics: ["post_payment_no_access", "price_objection"]
    required_signals: ["post_payment_no_access"]
    drop_topics: ["price_objection"]
  - required_topics: ["brand_list_request", "nonsense_input"]
    required_signals: ["brand_list"]
    drop_topics: ["nonsense_input"]
  - required_topics: ["company_services_info", "nonsense_input"]
    required_signals: ["company_services"]
    drop_topics: ["nonsense_input"]
  - required_topics: ["company_services_info", "legal_entity_purchase_flow"]
    history_pattern: "(договор|карточк|документ)"
    query_pattern: "(инн|телефон|контакт|\\+?\\d{5,}|[0-9]{5,})"
    drop_topics: ["legal_entity_purchase_flow"]
  - required_topics: ["company_services_info", "free_catalog_comparison"]
    drop_topics: ["company_services_info"]
  - required_topics: ["free_catalog_comparison", "nonsense_input"]
    drop_topics: ["nonsense_input"]
  - required_topics: ["free_catalog_comparison", "demo_access"]
    required_signals: ["free_access_request"]
    drop_topics: ["free_catalog_comparison"]
  - required_topics: ["no_private_sales_reason", "demo_access", "physical_person_purchase"]
    drop_topics: ["physical_person_purchase"]
  - required_topics: ["tis_tariffs", "purchase_ready"]
    history_pattern: "(только один бренд|отдельные бренды не продаются|отдельно можно купить только tis)"
    drop_topics: ["purchase_ready"]
    add_topics: ["partial_catalog_request"]
  - required_topics: ["legal_entity_purchase_flow", "purchase_ready"]
    query_pattern: "(qr|сч[её]т|счет|оплат[а-я]*)"
    drop_topics: ["purchase_ready"]
  - required_topics: ["legal_entity_purchase_flow", "purchase_ready"]
    history_pattern: "(физ\\w*|частн\\w*)"
    drop_topics: ["purchase_ready"]
    add_topics: ["physical_person_purchase"]
  - required_topics: ["purchase_ready", "legal_entity_purchase_flow"]
    required_signals: ["purchase_negative"]
    drop_topics: ["legal_entity_purchase_flow"]
  - required_topics: ["legal_entity_purchase_flow"]
    required_signals: ["purchase_negative"]
    drop_topics: ["legal_entity_purchase_flow"]
    add_topics: ["purchase_ready"]
  - required_topics: ["payment_without_details"]
    required_signals: ["purchase_negative"]
    drop_topics: ["payment_without_details"]
    add_topics: ["purchase_ready"]
  - required_topics: ["macos_support", "purchase_ready", "legal_entity_purchase_flow"]
    required_signals: ["macos"]
    drop_topics: ["legal_entity_purchase_flow"]
  - required_topics: ["macos_support", "purchase_ready"]
    history_not_pattern: "(купить|покупк|доступ|оформ|инн|сч[её]т|счет|qr|оплат)"
    drop_topics: ["purchase_ready"]
  - required_topics: ["no_private_sales_reason"]
    history_pattern: ".*(демо|demo|trial|демка).*"
    add_topics: ["demo_access"]
  - required_topics: ["macos_support", "legal_status_unknown"]
    history_pattern: ".*(инн|сч[её]т|счет|телефон|выставления счета).*"
    drop_topics: ["legal_status_unknown"]
    add_topics: ["purchase_ready"]
  - required_topics: ["partial_catalog_request", "epc_tariffs"]
    forbidden_signals: ["epc"]
    drop_topics: ["epc_tariffs"]
  - required_topics: ["tis_tariffs", "specific_brand_check"]
    history_pattern: "(только один бренд|отдельные бренды не продаются|отдельно можно купить только tis|отдельные каталоги)"
    add_topics: ["partial_catalog_request"]
    drop_topics: ["specific_brand_check"]
  - required_topics: ["specific_brand_check", "brand_list_request"]
    query_not_pattern: "(какие бренды|список брендов|все бренды|перечень брендов|конкретно)"
    drop_topics: ["brand_list_request"]
  - required_topics: ["specific_brand_check", "purchase_ready"]
    required_signals: ["specific_brand"]
    forbidden_signals: ["requisites"]
    drop_topics: ["purchase_ready"]
  - required_topics: ["specific_brand_check", "legal_entity_purchase_flow"]
    required_signals: ["specific_brand"]
    query_not_pattern: "(как оплат|данные|инн|сч[её]т|счет|qr)"
    drop_topics: ["legal_entity_purchase_flow"]
  - required_topics: ["company_services_info", "physical_person_purchase"]
    required_signals: ["closing"]
    drop_topics: ["company_services_info"]
  - required_topics: ["company_services_info", "nonsense_input"]
    required_signals: ["closing"]
    drop_topics: ["company_services_info"]
  - required_topics: ["company_services_info"]
    query_pattern: "(спасибо|благодар|понял|понятно)"
    drop_topics: ["company_services_info"]
    add_topics: ["nonsense_input"]

