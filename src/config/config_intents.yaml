dialogue_state:
  yes_words:
    - "да"
    - "yes"
    - "yep"
    - "ага"
    - "являюсь"
    - "ок"
    - "ok"
    - "подтверждаю"
  no_words:
    - "нет"
    - "no"
    - "nope"
    - "неа"
    - "не являюсь"
    - "не являюсь представителем"
  question_patterns:
    - type: "demo_legal_check"
      pattern: "((демо|demo|trial).*(юрид|автобизнес))|((юридическ\\w*\\s+лиц\\w*|представител\\w*\\s+автобизнес\\w*).*(демо|demo|trial))|((демо|demo|trial).*(представител\\w*\\s+автобизнес\\w*))"
    - type: "legal_status_check"
      pattern: "(вы\\s*(юр|юрид)|юридическ\\w*\\s+лиц\\w*)"
    - type: "invoice_confirmation"
      pattern: "(выставля|счет|сч[её]т|qr|реквизит)"
    - type: "purchase_confirmation"
      pattern: "(оформляем покупку|оформить покупку|как купить)"

signals:
  patterns:
    domain:
      - "\\b(каталог\\w*|доступ\\w*|подписк\\w*|epc|tis|инн|сч[её]т|qr|api|бренд\\w*|демо|мак|оплат\\w*)\\b"
    api:
      - "\\b(api|1с|интеграц|integration|crm|выгрузк)\\b"
    tis:
      - "\\b(tis|тис|tiss|тисс|тiс|тis|tис|tiс|техинфо|техническая информация|сервисная база)\\b"
    epc:
      - "\\b(epc|епс|ипс|епц|epс|ерс|узс)\\b"
      - "\\b(на год|на месяц|в месяц|на 3 месяца)\\b"
    price_objection:
      - "\\b(дорого|дешевле|дешёвле|дороговато)\\b"
    competitor:
      - "\\b(конкурент|уйду)\\b"
    demo:
      - "\\b(демо|demo|trial|демка|демо доступ)\\b"
    human:
      - "\\b(человек\\w*|менеджер\\w*|оператор\\w*|робот\\w*|соедини\\w*)\\b"
    company_services:
      - "\\b(о компании|услуги|что умеет|умеет ваша система|чем ты мне можешь помочь|чем еще можете помочь|что ты умеешь|подскажи|подробнее|короче|еще\\s+короче|ещ[её]\\s+короче|в двух словах|какой каталог лучше|чем вы лучше|скидк\\w*|договор|карточк\\w*|документ\\w*|не подбираете напрямую|подбираете напрямую|нескольким людям|несколько сотрудников|несколько пользователей)\\b"
    requisites:
      - "\\b(инн|реквизит\\w*|сч[её]т\\w*|qr)\\b"
    payment_method:
      - "(оплат\\w*\\s+по\\s+карт\\w*|по\\s+карт\\w*|картой|оплата\\s+карт\\w*|по\\s*qr|по\\s+сч[её]т\\w*)"
    payment_without_details:
      - "(без инн|инн не дам|без реквиз|город не скажу|не дам|инн позже дам|позже дам инн)"
    physical:
      - "\\b(физ\\w*|частн\\w*)\\b"
    no_private_reason:
      - "(почему.*физ|почему нельзя)"
    purchase_ready:
      - "\\b(как купить|оформить покупку|готов\\w* купить|готов\\w* оплатить|хочу оплатить|оформляем|хочу купить|нужен доступ|покупк\\w*)\\b"
      - "(просто доступ)"
    brand_list:
      - "\\b(какие бренды|список брендов|все бренды|перечень брендов)\\b"
      - "^(а\\s+)?какие\\s+есть\\??$"
      - "(по\\s+грузов\\w*\\s+что\\s+есть)"
    partial_catalog:
      - "(только один бренд|отдельные каталоги|только .* каталог)"
    data_accuracy:
      - "\\b(точн\\w*|актуальн\\w*|ошибк\\w*|устаревш\\w*|неверн\\w*)\\b"
    free_catalog:
      - "\\b(бесплатн\\w*|поставщик\\w*|в интернете)\\b"
    free_access_request:
      - "(дай\\s+бесплатн\\w*\\s+доступ|бесплатн\\w*\\s+доступ|бесплатн\\w*\\s+навсегда|бесплатно\\s+навсегда|free\\s+access)"
    macos:
      - "\\b(mac|macos|мак\\w*)\\b"
    purchase_negative:
      - "\\b(нет\\b|не сейчас|пока изучаю|позже(?!\\s*дам\\b)|не будем|не нужно)\\b"
    closing:
      - "\\b(спасибо|благодарю|благодарим|понял|поняла|понятно)\\b"
    parts_selection:
      - "\\b(подбер(и|ите|ите пожалуйста)|подобрат(ь|ь деталь)|артикул|номер детали|запчаст[ьи]|детал[ьи]|vin|вин)\\b"
    out_of_scope_catalog:
      - "\\b(космическ\\w*|корабл\\w*|велосипед\\w*|самокат\\w*|дрова)\\b"
    post_payment_no_access:
      - "(оплат\\w*.*(нет|не|без).*(доступ|вход|кабинет|открыва)|после\\s+оплат\\w*.*(нет|не).*(доступ|вход))"
    post_payment_access_timing:
      - "(после\\s+оплат\\w*.*(сразу|когда|как\\s+быстро).*(доступ|актив)|когда\\s+после\\s+оплат\\w*.*доступ)"
    usage_limits:
      - "(ограничен\\w*\\s+по\\s+запрос|лимит\\w*\\s+запрос|сколько\\s+запрос\\w*\\s+можно|безлимит\\w*)"
    multi_device_access:
      - "(с\\s+разных\\s+(компьютер|пк|устройств)|с\\s+другого\\s+компьютер|нескольк\\w*\\s+компьютер)"
    manager_setup_support:
      - "(кто\\s+поможет\\s+с\\s+настройк|консульт\\w*\\s+по\\s+настройк|вопрос\\w*\\s+по\\s+приложен|обучен\\w*\\s+по\\s+работе)"
    phone_like:
      - "\\b(телефон|номер|контакт|перезвон|позвон|связ[ьа])\\w*\\b"
      - "\\b\\d{5,}\\b"
  followup_price_pattern: "\\b(сколько|цена|стоит|на год|на месяц|в месяц)\\b"
  epc_history_short_price_pattern: "\\b(сколько|цена|на год|на месяц)\\b"
  api_rejection_pattern: "\\b(без api|без интеграц|api не нужен)\\b"

semantic_slots:
  patterns:
    payment_method_card:
      - "(оплат\\w*\\s+по\\s+карт\\w*|по\\s+карт\\w*|картой|банковск\\w*\\s+карт\\w*|по\\s*qr|qr\\s*код)"
    company_documents_card:
      - "(карточк\\w*\\s+(предприят|компан|организац)|карта\\s+предприят|карта\\s+компан|договор|документ\\w*)"
    geo_map_request:
      - "(карта\\s+филиал|географическ\\w*\\s+карт\\w*|где\\s+находит|локац\\w*\\s+офис|адрес\\w*\\s+филиал)"
    company_services_overview:
      - "(чем ты мне можешь помочь|что ты умеешь|подскажи|в двух словах|подробнее|короче|еще\\s+короче|ещ[её]\\s+короче|чем вы лучше|скидк\\w*)"
    out_of_scope_catalog:
      - "\\b(космическ\\w*|корабл\\w*|велосипед\\w*|самокат\\w*|дрова)\\b"
    pricing_request:
      - "\\b(сколько|цена|стоит|тариф|по деньгам|стоимость)\\b"
    catalog_list_request:
      - "(какие\\s+каталоги|какие\\s+марки|список\\s+бренд|какие\\s+есть)"
    feature_comparison:
      - "(чем\\s+отлич|разниц\\w*\\s+между|что\\s+лучше\\s+epc|что\\s+лучше\\s+tis)"
    refund_policy:
      - "(вернут\\w*\\s+деньг|возврат\\w*\\s+денег|refund|если\\s+не\\s+подошл|как\\s+вернуть\\s+деньги)"
    post_payment_access:
      - "(после\\s+оплат\\w*\\s+доступ\\w*\\s+сразу|когда\\s+после\\s+оплаты\\s+доступ)"
    multi_user_access:
      - "(нескольк\\w*\\s+сотрудник\\w*|нескольк\\w*\\s+пользоват\\w*|сколько\\s+доступов)"
    post_payment_no_access_slot:
      - "(оплат\\w*.*(нет|не|без).*(доступ|вход|кабинет|открыва)|после\\s+оплат\\w*.*(нет|не).*(доступ|вход))"
    post_payment_access_timing_slot:
      - "(после\\s+оплат\\w*.*(сразу|когда|как\\s+быстро).*(доступ|актив)|когда\\s+после\\s+оплат\\w*.*доступ)"
    usage_limits_slot:
      - "(ограничен\\w*\\s+по\\s+запрос|лимит\\w*\\s+запрос|сколько\\s+запрос\\w*\\s+можно|безлимит\\w*)"
    multi_device_access_slot:
      - "(с\\s+разных\\s+(компьютер|пк|устройств)|с\\s+другого\\s+компьютер|нескольк\\w*\\s+компьютер)"
    manager_setup_support_slot:
      - "(кто\\s+поможет\\s+с\\s+настройк|консульт\\w*\\s+по\\s+настройк|вопрос\\w*\\s+по\\s+приложен|обучен\\w*\\s+по\\s+работе)"
    nonsense_input:
      - "^\\s*[.]{1,3}\\s*$"
      - "^\\s*[,!?;:-]{1,4}\\s*$"
      - "^\\s*[\\W_]{2,}\\s*$"
      - "^\\s*[а-яa-z]{1,3}\\s*\\d{1,3}\\s*$"
      - "^\\s*[а-яa-z]{6,}\\d{2,}\\s*$"
    abuse_message:
      - "\\b(туп(и|ишь|ой)|мошенн(ик|ики)|идиот|бред|чушь|ужасно|отвратительно)\\b"

normalization_profile: "guardrails"

