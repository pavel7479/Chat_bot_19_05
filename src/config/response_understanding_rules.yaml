patterns:
  closing_phrase: "\\b(спасибо|благодар|понял|понятно)\\b"
  business_phrase: "\\b(сч[её]т|qr|инн|данн|реквиз|доступ|api|demo|демо|покуп|купить|оформ|оплат|каталог|бренд|epc|tis|ип|юр)\\w*\\b"
  checkout_intent: "\\b(как купить|хочу купить|оформ(ить|им|ля)|оплат(ить|а)|подключ(ить|им)|купить доступ|оформить доступ|покупк\\w*)\\b"
  api_fallback_purchase: "\\b(без api|api не нужен|без интеграц)\\b.*\\b(доступ|оформ|купить|оплат)\\w*\\b"
  legal_marker: "\\b(юр|юридическ|ип|инн|компан)\\w*\\b"
  price_query: "\\b(сколько|цена|стоит|тариф|на месяц|на год|на 3 месяца|на 6 месяцев|на 12 месяцев)\\b"
  parts_query: "\\b(подбер(и|ите|ите пожалуйста)|подобрат(ь|ь деталь)|артикул|номер детали|запчаст[ьи]|какую деталь)\\b"
  manager_query: "\\b(менеджер|оператор|человек|соедини|переключи)\\w*\\b"
  awaiting_phone: "(укажите|пришлите).*(номер|телефон)"
  phone_validation_prompt: "(корректн\\w*\\s+номер|11\\s*цифр)"
  greeting_query: "^(привет|здравствуй|здравствуйте|добрый день|добрый вечер|hello|hi)\\b"
  has_assistant_history: "^\\s*assistant:"
  deescalation_query: "(куда ты меня оформлять|горячку не пори|не пори|останов|спокойно)"
  compare_epc_tis_query: "(чем.*отлич|в чем.*отлич|в ч[её]м.*разниц|разниц.*между|отличи[ея])"
  docs_query: "\\b(договор|документ\\w*|карточк\\w*\\s+(предприят|компан)|карточк\\w*\\s+компан|карточк\\w*)\\b"
  out_of_scope_query: "\\b(велосипед\\w*|самокат\\w*|космическ\\w*|корабл\\w*|дрова|одежд\\w*|редк\\w*\\s+пород\\w*\\s+рыб)\\b"
  services_overview_query: "(чем ты мне можешь помочь|что ты умеешь|подскажи|в двух словах|подробнее|короче|еще|ещ[её]\\s+короче|какой каталог лучше|чем вы лучше|скидк\\w*|что еще умеет|что еще можете|чем еще можете помочь)"
  macos_focus: "\\b(mac|macos|мак)\\w*\\b"
  parts_focus: "\\b(подбер(и|ите|ите пожалуйста)|подобрат(ь|ь деталь)|артикул|номер детали|запчаст)\\b"
  out_of_scope_focus: "\\b(велосипед\\w*|самокат\\w*|космическ\\w*|корабл\\w*|дрова)\\b"
  brand_focus: "\\b(какие бренды|список брендов|все бренды|перечень брендов|есть ли каталог)\\b"
  demo_focus: "\\b(демо|demo|trial|демка)\\b"
  payment_focus: "\\b(инн|реквизит|сч[её]т|счет|qr|оплат)\\w*\\b"
  tis_mentioned: "\\b(tis|тис|tiss|техинфо|техническ\\w*\\s+информац\\w*|сервисн\\w*\\s+баз\\w*)\\b"
  epc_mentioned: "\\b(epc|епс|ипс|epc\\s*full)\\b"
  phone_like_keywords: "\\b(телефон|номер|контакт|связ[ьа]|перезвон|позвон)\\w*\\b"
  post_payment_no_access_focus: "(оплат\\w*.*(нет|не|без).*(доступ|вход|кабинет|открыва)|после\\s+оплат\\w*.*(нет|не).*(доступ|вход))"
  post_payment_access_timing_focus: "(после\\s+оплат\\w*.*(сразу|когда|как\\s+быстро).*(доступ|актив)|когда\\s+после\\s+оплат\\w*.*доступ)"
  usage_limits_focus: "(ограничен\\w*\\s+по\\s+запрос|лимит\\w*\\s+запрос|сколько\\s+запрос\\w*\\s+можно|безлимит\\w*)"
  multi_device_access_focus: "(с\\s+разных\\s+(компьютер|пк|устройств)|с\\s+другого\\s+компьютер|нескольк\\w*\\s+компьютер)"
  manager_setup_support_focus: "(кто\\s+поможет\\s+с\\s+настройк|консульт\\w*\\s+по\\s+настройк|вопрос\\w*\\s+по\\s+приложен|обучен\\w*\\s+по\\s+работе)"

focus_rules:
  - pattern: "macos_focus"
    required_topics_any: ["macos_support"]
    focus: "macos_support"
  - pattern: "docs_query"
    focus: "company_services_documents"
  - pattern: "parts_focus"
    focus: "parts_selection_not_supported"
  - pattern: "out_of_scope_focus"
    focus: "out_of_scope_response"
  - pattern: "brand_focus"
    focus: "brand_availability"
  - pattern: "demo_focus"
    required_topics_any: ["demo_access"]
    focus: "demo_policy"
  - pattern: "post_payment_no_access_focus"
    focus: "post_payment_no_access"
  - pattern: "post_payment_access_timing_focus"
    focus: "post_payment_access_timing"
  - pattern: "usage_limits_focus"
    focus: "usage_limits"
  - pattern: "multi_device_access_focus"
    focus: "multi_device_access"
  - pattern: "manager_setup_support_focus"
    focus: "manager_setup_support"
  - pattern: "payment_focus"
    required_topics_any: ["legal_entity_purchase_flow", "payment_without_details"]
    focus: "payment_flow"
  - required_topics_any: ["purchase_ready"]
    focus: "purchase_entry"
