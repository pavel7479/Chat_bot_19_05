intents:
- intent: epc_tariffs
  label_ru: Тарифы EPC
  aliases:
  - епс
  - epc full
  choose_when:
  - Пользователь явно спрашивает цену EPC.
  - Пользователь спрашивает стоимость подписки с явным упоминанием EPC.
  - Общий вопрос о цене без явного продукта может относиться и к EPC.
  not_choose_when:
  - Не выбирай для общего описания сервиса.
  - Не выбирай для реквизитов, ИНН и оформления.
  - Не выбирай только из-за слов "каталог" или "доступ" без вопроса о цене.
  - Не выбирай, если клиент явно спрашивает только про TIS.
  - Не выбирай как основную тему, если клиент спрашивает не цену EPC, а входит ли EPC в TIS, отличается ли EPC от TIS или отдельно ли они подключаются.
  - Не выбирай для "как купить подписку", если нет слов "цена", "стоимость", "сколько", "тариф", "по деньгам".
  examples:
  - сколько стоит EPC
  - цена EPC
  - стоимость подписки
- intent: tis_tariffs
  label_ru: Тарифы TIS
  aliases:
  - тис
  choose_when:
  - Пользователь явно спрашивает цену TIS.
  - Пользователь обсуждает TIS как отдельный продукт.
  - Пользователь просит расчёт TIS по бренду или по нескольким брендам.
  - Общий вопрос о цене без явного продукта может относиться и к TIS.
  not_choose_when:
  - Не выбирай для простого вопроса о наличии бренда без цены.
  - Не выбирай для общего списка брендов.
  - Не выбирай только из-за слов "каталог" или "доступ" без вопроса о цене.
  - Не выбирай, если клиент явно спрашивает только про EPC.
  - Не выбирай как основную тему, если клиент спрашивает не цену TIS, а входит ли TIS в EPC, отличается ли TIS от EPC или отдельно ли они подключаются.
  examples:
  - TIS
  - сколько TIS
  - а сколько TIS на него
  - TIS на BMW
  - посчитайте TIS Toyota Lexus Porsche
- intent: brand_list_request
  label_ru: Список брендов
  choose_when:
  - Пользователь просит общий список брендов или марок.
  - Пользователь спрашивает "какие бренды есть", "какие марки есть", "а какие есть".
  - Короткое "все" относится сюда, если клиент просит показать весь список.
  not_choose_when:
  - Не выбирай для одной конкретной марки.
  - Не выбирай, если клиент спрашивает наличие одного или нескольких конкретных брендов.
  - Не выбирай для цены.
  - Не выбирай для оформления.
  - Не выбирай, если клиент не просит список, а сам перечисляет конкретные бренды.
  - Не выбирай, если клиент перечисляет бренды для расчёта TIS.
  examples:
  - какие бренды есть
  - а какие есть
  - все
- intent: catalog_list_request
  label_ru: Список каталогов
  choose_when:
  - Пользователь спрашивает какие каталоги или типы каталогов доступны.
  - Пользователь спрашивает какие продукты есть.
  - Пользователь просит перечислить доступные каталоги.
  - Пользователь спрашивает что есть кроме EPC или TIS.
  not_choose_when:
  - Не выбирай для конкретной марки автомобиля.
  - Не выбирай для проверки наличия бренда.
  - Не выбирай для списка брендов или марок.
  - Не выбирай для сравнения EPC и TIS.
  examples:
  - какие каталоги есть
  - что у вас есть
  - какие продукты есть
  - какие типы каталогов доступны
- intent: specific_brand_check
  label_ru: Проверка конкретного бренда
  choose_when:
  - Пользователь спрашивает наличие конкретного бренда.
  - Пользователь спрашивает наличие нескольких конкретных брендов.
  - Пользователь уточняет, поддерживается ли конкретная марка.
  - Пользователь пишет бренды с опечатками или транслитом.
  not_choose_when:
  - Не выбирай для общего списка брендов.
  - Не выбирай для общего запроса списка брендов без конкретных марок.
  - Не выбирай для расчёта цены TIS.
  - Не выбирай как замену pricing intent.
  - Не выбирай для покупки одного бренда как отдельного пакета EPC.
  - Не выбирай, если марка не названа, а клиент спрашивает о возможности дать каталоги только одного бренда или не полный пакет EPC.
  examples:
  - есть Volvo
  - BMW есть?
  - есть ли каталог УАЗ
- intent: company_services_info
  label_ru: Возможности сервиса
  choose_when:
  - Пользователь просит рассказать о компании и услугах.
  - Пользователь спрашивает, что вообще умеет сервис.
  - Пользователь спрашивает, какие возможности есть у системы.
  - Пользователь спрашивает, как сервис помогает в работе.
  - Пользователь спрашивает о преимуществах сервиса или общем формате работы.
  - Пользователь спрашивает про общие ограничения, ограничения процесса или формат работы сервиса.
  not_choose_when:
  - Не выбирай, если пользователь упоминает цену, стоимость, подписку или тариф.
  - Не выбирай, если пользователь упоминает бренд автомобиля или каталог конкретной марки.
  - Не выбирай для реквизитов, ИНН, счета, договора или шагов оформления.
  - Не выбирай для возврата или проблемы после оплаты.
  - Не выбирай для API.
  - Не выбирай для отличия EPC и TIS.
  - Не выбирай для списка каталогов или продуктов.
  - Не выбирай для вопросов о количестве пользователей, сотрудников, рабочих мест или совместном использовании доступа.
  examples:
  - что умеет сервис
  - какие функции
  - какие преимущества
  - Расскажите о компании и услугах
  - Что вообще умеет ваша система
  - Как работает сервис
- intent: multi_device_access
  label_ru: Многопользовательский доступ
  aliases:
  - multi user
  - multi device
  choose_when:
  - Пользователь спрашивает, можно ли пользоваться доступом нескольким людям.
  - Пользователь обсуждает несколько сотрудников, пользователей или рабочих мест.
  - Пользователь спрашивает про многопользовательский доступ.
  - Пользователь обсуждает число пользователей или совместное использование доступа.
  - Пользователь спрашивает, можно ли работать с разных компьютеров или устройств.
  not_choose_when:
  - Не выбирай для вопроса о цене.
  - Не выбирай для брендов.
  - Не выбирай для API.
  - Не выбирай для помощи менеджера.
  - Не выбирай для общего описания сервиса без вопроса о количестве пользователей или устройств.
  examples:
  - можно ли пользоваться нескольким людям
  - несколько сотрудников могут работать
  - доступ на двух пользователей
  - можно нескольким людям
  - два человека смогут пользоваться
  - можно с двух устройств
- intent: purchase_ready
  label_ru: Готовность к покупке
  choose_when:
  - Пользователь прямо говорит что хочет купить.
  - Пользователь просит оформить или подключить доступ.
  - Пользователь готов двигаться к покупке без вопроса про ИНН и реквизиты.
  - Пользователь спрашивает, как купить или как оформить подписку без обсуждения способов оплаты и продления.
  not_choose_when:
  - Если клиент спрашивает что нужно для оформления, это `legal_entity_purchase_flow`.
  - Если клиент спрашивает, как оплатить, это `payment_process`.
  - Если клиент спрашивает, как продлить доступ, это `subscription_renewal`.
  - Не выбирай для цены, брендов, возврата и демо.
  examples:
  - хочу купить
  - давайте оформим
  - готов подключить доступ
  - как купить подписку
  - как оформить подписку
  - как подключить доступ
- intent: legal_entity_purchase_flow
  label_ru: Оформление для юрлица
  choose_when:
  - Пользователь обсуждает оформление от имени компании или ИП.
  - Пользователь спрашивает куда отправить ИНН или реквизиты.
  - Пользователь просит договор, счет или карточку предприятия.
  - Пользователь обсуждает период, число доступов и способ оплаты.
  - "Пользователь выбирает способ оплаты в рамках оформления: счет, карта или QR-код."
  - Пользователь подтверждает следующий шаг оформления после запроса реквизитов или способа оплаты.
  not_choose_when:
  - Не выбирай, если клиент только выражает готовность купить без вопроса про оформление.
  - Не выбирай для цены, брендов, демо или возврата.
  examples:
  - что нужно для счета
  - куда отправить ИНН
  - пришлите договор
  - давайте по qr
  - оплатим по карте
  - выставите счет
  - да
  - являюсь
  - yes, legal
- intent: self_employed_purchase
  label_ru: Самозанятые
  choose_when:
  - Пользователь спрашивает, работаете ли вы с самозанятыми.
  - Пользователь пишет, что он самозанятый, и интересуется покупкой доступа.
  not_choose_when:
  - Не выбирай для ИП или юридических лиц.
  - Не выбирай для общих преимуществ сервиса.
  examples:
  - вы работаете с самозанятыми
  - можно самозанятым
  - я самозанятый
- intent: existing_contract_check
  label_ru: Проверка договора
  choose_when:
  - Пользователь просит проверить существующий договор.
  - Пользователь спрашивает про статус договора или номер договора.
  not_choose_when:
  - Не выбирай для нового оформления доступа.
  - Не выбирай для общего запроса документов компании.
  examples:
  - проверить договор
  - мне нужно проверить существующий договор
  - номер договора
- intent: subscription_renewal
  label_ru: Продление подписки
  choose_when:
  - Пользователь спрашивает, как продлить подписку или доступ.
  - Пользователь обсуждает продление текущего доступа.
  not_choose_when:
  - Не выбирай для первичной покупки.
  - Не выбирай для общего вопроса о цене.
  examples:
  - как продлить подписку
  - продление подписки
  - хочу продлить доступ
- intent: payment_process
  label_ru: Процесс оплаты
  choose_when:
  - Пользователь спрашивает, как оплатить.
  - Пользователь спрашивает про способы оплаты.
  - Пользователь спрашивает, можно ли оплатить картой, QR или по счету.
  not_choose_when:
  - Не выбирай для общего вопроса о цене.
  - Не выбирай для уже переданных реквизитов и счета.
  examples:
  - как оплатить
  - какие способы оплаты
  - можно картой
  - можно по счету
- intent: payment_without_details
  label_ru: Оплата без реквизитов
  choose_when:
  - Пользователь хочет оплатить, но не дает ИНН.
  - Пользователь хочет оплатить без реквизитов или без города.
  - Пользователь пытается обойти обязательные данные для счета.
  not_choose_when:
  - Пользователь согласен пройти стандартный процесс оформления с реквизитами.
  examples:
  - оплачу, но ИНН не дам
  - без реквизитов можно
  - город не скажу, оплату примите
- intent: physical_person_purchase
  label_ru: Покупка как физлицо
  choose_when:
  - Пользователь хочет купить как частное лицо.
  - Пользователь прямо говорит что он не юрлицо или не ИП.
  not_choose_when:
  - Не выбирай, если клиент просит демо.
  - Не выбирай как основную тему, если клиент только спрашивает причину отказа для физлиц без намерения покупки.
  - Не выбирай, если клиент обсуждает покупку от имени компании или ИП.
  examples:
  - хочу купить как физлицо
  - я физик
  - я не ИП
- intent: no_private_sales_reason
  label_ru: Почему не продаем физлицам
  choose_when:
  - Пользователь спрашивает причину отказа для физлиц.
  - Пользователь просит объяснить, почему продажа только для автобизнеса.
  not_choose_when:
  - Не выбирай, если пользователь просто пытается купить как физлицо.
  examples:
  - почему физикам нельзя
  - почему не продаете физлицам
  - в чем причина отказа
- intent: price_objection
  label_ru: Возражение по цене
  choose_when:
  - Пользователь говорит что дорого.
  - Пользователь просит скидку именно из-за цены.
  - Пользователь выражает недовольство стоимостью после озвученных тарифов.
  not_choose_when:
  - Не выбирай для нейтрального вопроса о цене.
  - Фразы "сколько стоит", "что по деньгам", "стоимость подписки", "какая цена" не являются `price_objection`.
  examples:
  - дорого
  - у вас завышена цена
  - скидку сделаете
- intent: competitor_choice
  label_ru: Выбор конкурента
  choose_when:
  - Пользователь прямо говорит что уйдет к конкуренту.
  - Пользователь выбирает другое решение из-за цены или условий.
  not_choose_when:
  - Не выбирай, если пользователь только сравнивает варианты без решения уйти.
  examples:
  - уйду к конкуренту
  - выберу другой сервис
  - у других дешевле, пойду к ним
- intent: competitor_comparison
  label_ru: Отличие от конкурентов
  choose_when:
  - Пользователь спрашивает, в чем отличие от конкурентов.
  - Пользователь спрашивает, чем вы лучше конкурентов.
  - Пользователь просит объяснить преимущества выбора сервиса перед конкурентами.
  not_choose_when:
  - Не выбирай для сравнения EPC и TIS.
  - Не выбирай для прямой угрозы уйти к конкуренту, это `competitor_choice`.
  - Не выбирай для сравнения с бесплатными каталогами, это `free_catalog_comparison`.
  examples:
  - в чем отличие от конкурентов
  - чем вы лучше конкурентов
  - почему выбрать вас
- intent: partial_catalog_request
  label_ru: Только один бренд
  choose_when:
  - Пользователь спрашивает, можно ли купить не полный пакет EPC Full.
  - Пользователь спрашивает, можно ли подключить только часть каталога вместо полного EPC Full.
  - Пользователь спрашивает, продается ли EPC Full по отдельным брендам.
  - Пользователь спрашивает, можно ли купить один бренд именно как часть EPC Full.
  not_choose_when:
  - Не выбирай для простой фразы с конкретным брендом без вопроса о частичной продаже EPC Full.
  - Не выбирай для "нужна Toyota", "только УАЗ", "интересует BMW" — это TIS-контекст.
  - Не выбирай для цены TIS по бренду.
  - Не выбирай для проверки наличия конкретного бренда.
  examples:
  - можно купить только один бренд в EPC?
  - можно не полный пакет, а одну марку?
  - EPC Full продается по отдельным брендам?
  - можно купить часть каталога?
  - есть ли возможность предоставить каталоги только одного бренда
  - можно ли предоставить каталоги только одного бренда
- intent: demo_access
  label_ru: Демо-доступ
  choose_when:
  - Пользователь просит демо, пробный или тестовый доступ.
  not_choose_when:
  - Не выбирай, если клиент обсуждает только платную покупку или цену без запроса демо.
  - Не выбирай для "ну попробуй", "рассказывай", "да" после общего приветствия или предложения рассказать о сервисе.
  examples:
  - демо
  - а демо есть?
  - пробный доступ
- intent: free_catalog_comparison
  label_ru: Сравнение с бесплатными каталогами
  choose_when:
  - Пользователь сравнивает сервис с бесплатными каталогами.
  - Пользователь спрашивает, почему стоит платить за платный каталог.
  - Пользователь спрашивает, чем сервис отличается от бесплатных источников.
  not_choose_when:
  - Не выбирай для общего вопроса о преимуществах без сравнения с бесплатными решениями.
  - Не выбирай для сравнения EPC и TIS между собой; это `product_relation_or_difference`.
  examples:
  - чем вы лучше бесплатных каталогов
  - зачем платить если есть бесплатные
  - сравните с бесплатными источниками
- intent: product_relation_or_difference
  label_ru: Связь и различие продуктов
  aliases:
  - epc tis
  - епс тис
  - epc full tis
  choose_when:
  - Пользователь явно упоминает EPC, TIS или EPC Full и спрашивает, чем эти продукты отличаются.
  - Пользователь явно упоминает EPC, TIS или EPC Full и спрашивает, входит ли один продукт в другой.
  - Пользователь явно упоминает EPC, TIS или EPC Full и спрашивает, отдельно ли эти продукты подключаются или покупаются.
  - Пользователь явно упоминает EPC Full и спрашивает, что входит в состав продукта.
  not_choose_when:
  - Не выбирай для обычного вопроса о цене EPC без сравнения с TIS.
  - Не выбирай для обычного вопроса о цене TIS без сравнения с EPC.
  - Не выбирай, если пользователь говорит абстрактно про "каталоги", "один каталог" или "другой каталог" без явного EPC, TIS или EPC Full.
  - Не выбирай для абстрактного вопроса "чем отличается один каталог от другого", если клиент не указал EPC, TIS, EPC Full или состав конкретного продукта.
  - Не выбирай для сравнения платного сервиса с бесплатными каталогами; это `free_catalog_comparison`.
  - Не выбирай для общего описания возможностей сервиса; это `company_services_info`.
  - Не выбирай для вопроса о наличии конкретного бренда.
  examples:
  - чем EPC отличается от TIS
  - TIS входит в EPC Full?
  - EPC туда входит или отдельно?
  - это один продукт или разные?
  - TIS отдельно покупается?
  - EPC Full включает технические базы?
- intent: data_accuracy_doubt
  label_ru: Сомнение в точности данных
  choose_when:
  - Пользователь сомневается в актуальности и точности данных.
  - Пользователь боится ошибок VIN, неверных номеров или устаревшей информации.
  not_choose_when:
  - Не выбирай, если пользователь обсуждает цену или покупку без сомнений в данных.
  examples:
  - данные точные?
  - у вас не будет ошибок по VIN?
  - информация актуальная?
- intent: api_integration
  label_ru: API и интеграция
  choose_when:
  - Пользователь спрашивает про API.
  - Пользователь обсуждает интеграцию с 1С, сайтом, CRM или другой системой.
  - Пользователь спрашивает про формат технического подключения.
  not_choose_when:
  - Не выбирай, если пользователь обсуждает только доступ к каталогу без интеграции.
  examples:
  - есть API
  - интеграция с 1С нужна
  - можно подключить к CRM
- intent: human_operator_request
  label_ru: Перевод на менеджера
  choose_when:
  - Пользователь просит человека, менеджера или оператора.
  - Пользователь отказывается продолжать диалог с ботом.
  - Выбирай, если клиент агрессивно конфликтует с ботом, оскорбляет систему или требует живого человека после негативного
    диалога.
  - Пользователь просит менеджера после технического вопроса.
  - Пользователь просит соединить с человеком, чтобы обсудить API, интеграцию или настройку.
  - Пользователь обвиняет компанию в обмане.
  - Пользователь конфликтует с ботом или сервисом.
  - Пользователь использует агрессивную лексику в адрес сервиса.
  not_choose_when:
  - Не выбирай, если пользователь задает обычный предметный вопрос по продукту.
  examples:
  - позовите менеджера
  - хочу человека
  - соедините с оператором
- intent: post_payment_access_timing
  label_ru: Когда доступ после оплаты
  choose_when:
  - Пользователь спрашивает когда активируется доступ после оплаты.
  - Пользователь спрашивает через сколько времени появится доступ.
  - Пользователь спрашивает когда можно начинать работу.
  not_choose_when:
  - Не выбирай, если пользователь сообщает о фактической проблеме после оплаты.
  examples:
  - после оплаты доступ сразу появится?
  - через сколько доступ после оплаты
  - когда начнет работать после оплаты
- intent: post_payment_no_access
  label_ru: Оплатил, но доступа нет
  choose_when:
  - Пользователь оплатил, но доступа нет.
  - Пользователь просит решить проблему после оплаты.
  - Пользователь спрашивает про возврат денег после оплаты.
  - Фразы "если не подошло", "можно вернуть деньги", "как вернуть" идут сюда.
  not_choose_when:
  - Не выбирай, если клиент только спрашивает сроки активации доступа после оплаты.
  examples:
  - оплатил, но доступа нет
  - можно вернуть деньги если не подошло
  - как вернуть
- intent: manager_setup_support
  label_ru: Помощь в запуске и настройке
  choose_when:
  - Пользователь спрашивает будет ли помощь менеджера по старту и настройке.
  - Пользователь просит обучение, сопровождение или помощь в запуске.
  not_choose_when:
  - Не выбирай, если пользователь просит только цены или бренды.
  - Вопрос "можно ли пользоваться нескольким людям" не относится к `manager_setup_support`.
  examples:
  - поможете настроить после покупки
  - будет обучение
  - нужен запуск с менеджером
- intent: macos_support
  label_ru: Поддержка macOS
  choose_when:
  - Пользователь спрашивает есть ли работа на Mac или macOS.
  - Пользователь спрашивает про версию или софт для Apple-устройств.
  not_choose_when:
  - Не выбирай, если пользователь не обсуждает операционную систему.
  examples:
  - на macOS есть софт?
  - на маке работает?
  - есть версия для Apple
- intent: nonsense_input
  label_ru: Непонятный или шумный ввод
  choose_when:
  - Случайные символы, шум, бессмысленный ввод.
  - Нет понятного продуктового сигнала.
  - Случайные символы, бессмысленные сообщения, нерелевантный ответ на вопрос бота.
  not_choose_when:
  - Короткие продуктовые реплики вроде "TIS", "EPC", "демо", "Volvo" не являются шумом.
  examples:
  - '....'
  - ммммм 235
- intent: out_of_scope_request
  label_ru: Вне профиля компании
  choose_when:
  - Пользователь просит то, что не относится к автокаталогам, техинформации, тарифам, покупке или поддержке сервиса.
  not_choose_when:
  - Не выбирай, если сообщение относится к продукту компании и может быть классифицировано одной из профильных тем.
  - Не выбирай для агрессии, конфликта или претензии к компании.
  examples:
  - какая погода завтра
  - помоги с налогами
  - забронируй отель
